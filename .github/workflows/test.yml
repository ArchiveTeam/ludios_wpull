name: Unit Tests

# on: [push]
on:
    pull_request:
        branches:
            - master
            - main
permissions:
  pull-requests: write
jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v7
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: ${{ matrix.python-version }}
          # Optional - x64 or x86 architecture, defaults to x64
          architecture: 'x64'
      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends wget ca-certificates git build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev libxml2-dev libxslt1-dev libre2-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary lxml lxml
          pip install coverage
          pip install .["testing"]
      - name: Run unittests with coverage report
        # continue-on-error: true
        run: |
          coverage run --include="./wpull/**/*.py" -m unittest discover -p "*_test.py"
      - name: Generate coverage report
        if: always()
        run: |
          coverage xml --data-file=.coverage
      # You can test your matrix by printing the current Python version
      # - name: Display Python version
        # run: python -c "import sys; print(sys.version)"
      - name: Get Cover 
        if: always()
        uses: orgoro/coverage@v3.3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Python Coverage ${{ matrix.python-version }}
