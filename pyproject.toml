[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wpull"
description = "Wget-compatible web downloader and crawler."
authors = [{name = "Christopher Foo", email = "chris.foo@gmail.com"}]
readme = "README.orig.rst"
version = "5.0.3"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python :: 3',
    'Topic :: Internet :: File Transfer Protocol (FTP)',
    'Topic :: Internet :: WWW/HTTP',
    'Topic :: System :: Archiving',
]
requires-python = ">=3.12"
dependencies = [
    "chardet",
    "dnspython",
    "html5-parser",
    "lxml",
    "psutil~=5.9",
    "sqlalchemy~=2.0.0",
    "tornado~=6.4",
    # Required due to yapsy 1.12.2 using deprecated modules
    "yapsy @ https://github.com/tibonihoo/yapsy/archive/refs/heads/master.zip#subdirectory=package",
    # Required for yapsy during testing
    "packaging"

]

[project.optional-dependencies]
docs = [
    "sphinx-argparse<=0.1.15",
    "sphinxcontrib-napoleon>=0.2.6,<=0.5.0",
]
testing = [
    "warcat"
]

[tool.setuptools.packages.find]
# namespaces = true also picks up directories without __init__.py that hold
# package data (wpull.cert, wpull.testing.samples, ...), which setuptools would
# otherwise warn about and silently drop from the distribution.
include = ["wpull*"]
namespaces = true

[project.urls]
Source = "https://github.com/ArchiveTeam/ludios_wpull"

[project.scripts]
wpull = "wpull.application.main:main"
wpull5 = "wpull.application.main:main"

[tool.coverage.run]
omit = [
    "index_html.generated.py"
]
